services:
  api:
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
      - ./prompts:/app/prompts:ro
    environment:
      WSIGNAL_DEBUG: "true"
      WATCHFILES_FORCE_POLLING: "true"
    command:
      - uvicorn
      - wsignal.interface.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src

  db:
    ports:
      - "${POSTGRES_PORT:-55432}:5432"

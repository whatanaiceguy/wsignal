[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# sqlalchemy.url is deliberately absent. migrations/env.py reads it from
# WSIGNAL_DATABASE_URL so the container and a local shell cannot disagree about
# which database they are migrating.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
